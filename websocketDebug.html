<!doctype html>

<body>
  <h1>WebSocket Debugger</h1>

  <script>
    const BASE_URL = "http://localhost:5148";
    let ws;

    async function auth(base_url) {
      console.log("Doing debug auth");
      const resp = await fetch(base_url + "/api/auth/debug", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: 1,
        }),
      });
      const respJson = await resp.json();
      console.log(respJson);
      return respJson.token;
    }

    function logMessage(msg, color) {
      const messages = document.querySelector("#messages");
      const message = document.createElement("code");
      message.innerText = msg;
      message.style =
        "background: " +
        color +
        "; color: white; padding: 4px; white-space:pre";
      messages.appendChild(message);
    }

    async function openWs() {
      if (ws != null) {
        closeWs();
      }

      const token = await auth(BASE_URL);
      const url = `${BASE_URL}/api/order/events?showPaymentPending=true&apiKey=${encodeURIComponent(token)}`;
      ws = new WebSocket(url, ["rij62.OrderEvents"]);

      ws.addEventListener("open", (e) => {
        logMessage("websocket connection open", "green");
      });

      ws.addEventListener("close", (e) => {
        const color = e.code == 1000 ? "blue" : "red";
        logMessage(
          "websocket connection closed " + e.code + ": " + e.reason,
          color,
        );
      });

      ws.addEventListener("message", (e) => {
        const json = JSON.parse(e.data);
        logMessage(JSON.stringify(json, null, 2), "gray");
        console.log(json);
      });
    }
    function closeWs() {
      ws.close();
      ws = null;
    }
    async function fastClose() {
      await openWs();
      ws.addEventListener("open", (e) => {
        closeWs();
      });
    }

    (async () => {
      await openWs();
    })();
  </script>

  <div
    id="messages"
    style="display: flex; flex-direction: column; gap: 4px"
  ></div>

  <button onclick="closeWs()">Close websocket</button>
  <button onclick="openWs()">Open websocket</button>
  <button onclick="fastClose()">Test fast close</button>
</body>
